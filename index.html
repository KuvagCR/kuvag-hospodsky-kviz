<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KUVAG – Firemní hospodský kvíz</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#23555b,#092a30 75%);color:#f8f3e7;font:16px system-ui,sans-serif;min-height:100vh}.wrap{max-width:590px;margin:6vh auto;padding:16px}header{text-align:center}.brand{letter-spacing:.28em;color:#e2bf78;font-weight:800}h1{font-size:clamp(30px,6vw,48px);margin:12px 0}header p{color:#cbd8d4;margin-bottom:30px}.card{background:#123c41;padding:clamp(24px,5vw,42px);border:1px solid #65827d;border-radius:20px;box-shadow:0 18px 50px #001c2060}h2{margin:0 0 20px}label{display:block;margin:16px 0 7px;font-weight:650}input{width:100%;padding:13px;border:1px solid #849b95;border-radius:9px;background:#fffdf7;color:#142e31;font:inherit}input:focus{outline:3px solid #d9b56d}small{color:#bdceca}button{margin-top:26px;width:100%;padding:15px;border:0;border-radius:10px;background:#e0bc73;color:#123239;font:inherit;font-weight:800;cursor:pointer}button:disabled{opacity:.6}#notice{display:none;padding:14px;border-radius:10px;margin-top:18px;line-height:1.5}#notice.error{display:block;background:#723333}#notice.success{display:block;background:#286048}footer{text-align:center;color:#b5cbc7;font-size:13px;margin-top:22px}
</style></head><body><main class="wrap"><header><div style="font-size:44px">🍺</div><div class="brand">KUVAG</div><h1>Firemní hospodský kvíz</h1><p>Sestavte tým a přihlaste se do společného kvízu.</p></header><section class="card"><h2>Registrace týmu</h2><form id="form"><label for="team">Název týmu *</label><input id="team" required maxlength="100" placeholder="Název vašeho týmu"><p>Jména hráčů <small>(nepovinná, maximálně 5)</small></p><div id="players"></div><button id="send">Přihlásit tým</button><div id="notice" role="status" aria-live="polite"></div></form></section><footer>Přihlášené týmy a hráči nejsou veřejně zobrazováni.</footer></main><script>
const api='https://cwvnxyuxpguwmhmnktfl.supabase.co/rest/v1/quiz_teams',key='sb_publishable_RngImYE-d_pdUdvG90eu4g_vxGrZvlF',players=document.getElementById('players'),form=document.getElementById('form'),notice=document.getElementById('notice'),send=document.getElementById('send');
for(let i=1;i<=5;i++){const label=document.createElement('label');label.htmlFor='player'+i;label.textContent='Hráč '+i;const input=document.createElement('input');input.id='player'+i;input.maxLength=100;input.placeholder='Jméno hráče '+i;players.append(label,input)}
function show(t,type){notice.textContent=t;notice.className=type}
form.addEventListener('submit',async e=>{e.preventDefault();const team=document.getElementById('team').value.trim().replace(/\s+/g,' ');if(!team){show('Vyplňte název týmu.','error');return}const names=[...players.querySelectorAll('input')].map(x=>x.value.trim()).filter(Boolean);send.disabled=true;notice.className='';try{const r=await fetch(api,{method:'POST',headers:{'apikey':key,'Authorization':'Bearer '+key,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({team_name:team,players:names})});if(r.ok){form.reset();show('Tým byl úspěšně přihlášen!','success')}else{const data=await r.json().catch(()=>({}));show(data.code==='23505'?'Tento tým je již přihlášen! Tým s tímto názvem už je na hospodský kvíz zaregistrován. Zvolte prosím jiný název týmu.':'Registrace se nepodařila. Zkuste to prosím znovu.','error')}}catch{show('Nelze se připojit k databázi. Zkuste to znovu.','error')}finally{send.disabled=false}});
</script></body></html>
