<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KUVAG – Administrace kvízu</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b3036;color:#f7f4ea;font:16px system-ui,sans-serif}main{max-width:1100px;margin:35px auto;padding:18px}h1{font-size:clamp(26px,5vw,38px)}.panel{background:#17434a;border:1px solid #54767a;border-radius:16px;padding:25px;margin:20px 0}label{display:block;margin:14px 0 6px}input{width:100%;padding:11px;border-radius:8px;border:1px solid #91a6a4;font:inherit}button{padding:10px 15px;border:0;border-radius:8px;background:#e1ba71;color:#15353a;font:inherit;font-weight:700;cursor:pointer;margin:8px 8px 8px 0}button.secondary{background:#d3ded9}button.danger{background:#f1aaa1}button:disabled{opacity:.5}#message{min-height:24px;color:#f7c8aa}.stats{display:flex;gap:14px;flex-wrap:wrap}.stat{background:#25565b;padding:15px 22px;border-radius:12px}strong{font-size:1.5rem}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px;border-bottom:1px solid #527276;vertical-align:top}th{color:#e1ba71}td button{font-size:13px}#tablewrap{overflow-x:auto}a{color:#e1ba71}dialog{background:#173f46;color:#fff;border:1px solid #7d9898;border-radius:15px;max-width:500px;width:calc(100% - 32px)}dialog::backdrop{background:#000a}small{color:#bed2d1}
</style></head><body><main><h1>KUVAG – Administrace hospodského kvízu</h1><p><a href="./">← Registrační stránka</a></p><div id="message" role="status"></div><section class="panel" id="login"><h2>Přihlášení organizátora</h2><p>Přístup má pouze ověřený účet organizátora.</p><form id="loginform"><label for="email">E-mail</label><input id="email" type="email" required value="barbora.hozmanova@kuvag.cz"><label for="password">Heslo</label><input id="password" type="password" required><button>Přihlásit se</button></form><p><small>Pokud účet v tomto projektu ještě nemáš, vytvoříme ho pozvánkou v Supabase.</small></p></section><section id="dashboard" hidden><button class="secondary" id="logout">Odhlásit se</button><div class="stats"><div class="stat">Týmy<br><strong id="teamcount">0</strong></div><div class="stat">Hráči<br><strong id="playercount">0</strong></div></div><div class="panel"><h2>Přihlášené týmy</h2><button id="refresh">Obnovit</button><button id="export">Export do Excelu (CSV)</button><div id="tablewrap"><table><thead><tr><th>Tým</th><th>Hráči</th><th>Datum registrace</th><th>Akce</th></tr></thead><tbody id="rows"></tbody></table></div></div></section></main><dialog id="editor"><form id="editform"><h2>Upravit tým</h2><label for="editname">Název týmu</label><input id="editname" required maxlength="100"><div id="editplayers"></div><button>Uložit</button><button type="button" class="secondary" id="cancel">Zrušit</button></form></dialog><script>
const url='https://cwvnxyuxpguwmhmnktfl.supabase.co',key='sb_publishable_RngImYE-d_pdUdvG90eu4g_vxGrZvlF';let token='',refreshToken='',teams=[],editing=null;const el=id=>document.getElementById(id),msg=t=>el('message').textContent=t;const headers=()=>({'apikey':key,'Authorization':'Bearer '+token});async function request(path,options={}){const r=await fetch(url+path,{...options,headers:{...headers(),...(options.headers||{})}});if(!r.ok){const err=await r.json().catch(()=>({}));throw new Error(err.code==='23505'?'Tento název týmu už existuje.':err.message||'Požadavek se nezdařil.')}return r.status===204?null:r.json()}
function session(s){token=s?.access_token||'';refreshToken=s?.refresh_token||'';el('login').hidden=!!token;el('dashboard').hidden=!token;if(token){sessionStorage.setItem('quizSession',JSON.stringify(s));load()}else{sessionStorage.removeItem('quizSession');teams=[]}}
async function load(){try{teams=await request('/rest/v1/quiz_teams?select=id,team_name,players,created_at&order=created_at.desc');el('teamcount').textContent=teams.length;el('playercount').textContent=teams.reduce((n,t)=>n+(t.players?.length||0),0);el('rows').replaceChildren();for(const t of teams){const tr=document.createElement('tr');for(const value of [t.team_name,(t.players||[]).join(', ')||'—',new Date(t.created_at).toLocaleString('cs-CZ')]){const td=document.createElement('td');td.textContent=value;tr.append(td)}const actions=document.createElement('td');const edit=document.createElement('button');edit.textContent='Upravit';edit.onclick=()=>openEditor(t);const del=document.createElement('button');del.className='danger';del.textContent='Smazat';del.onclick=()=>remove(t);actions.append(edit,del);tr.append(actions);el('rows').append(tr)}msg('')}catch(e){msg('Nelze načíst registrace: '+e.message)}}
el('loginform').onsubmit=async e=>{e.preventDefault();try{const r=await fetch(url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':key,'Content-Type':'application/json'},body:JSON.stringify({email:el('email').value.trim(),password:el('password').value})});const s=await r.json();if(!r.ok)throw Error('Přihlášení se nezdařilo. Zkontroluj e-mail, heslo a potvrzení účtu.');session(s);el('password').value='';msg('')}catch(e){msg(e.message)}};
el('logout').onclick=()=>{fetch(url+'/auth/v1/logout',{method:'POST',headers:headers()}).catch(()=>{});session(null);msg('Odhlášeno.')};el('refresh').onclick=load;
for(let i=1;i<=5;i++){const l=document.createElement('label');l.textContent='Hráč '+i;l.htmlFor='ep'+i;const input=document.createElement('input');input.id='ep'+i;input.maxLength=100;el('editplayers').append(l,input)}
function openEditor(t){editing=t.id;el('editname').value=t.team_name;for(let i=1;i<=5;i++)el('ep'+i).value=t.players?.[i-1]||'';el('editor').showModal()}el('cancel').onclick=()=>el('editor').close();
el('editform').onsubmit=async e=>{e.preventDefault();try{const name=el('editname').value.trim().replace(/\s+/g,' ');const players=Array.from({length:5},(_,i)=>el('ep'+(i+1)).value.trim()).filter(Boolean);await request('/rest/v1/quiz_teams?id=eq.'+encodeURIComponent(editing),{method:'PATCH',headers:{'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({team_name:name,players})});el('editor').close();await load()}catch(e){msg(e.message)}};
async function remove(t){if(!confirm('Opravdu smazat tým „'+t.team_name+'“?'))return;try{await request('/rest/v1/quiz_teams?id=eq.'+encodeURIComponent(t.id),{method:'DELETE',headers:{'Prefer':'return=minimal'}});await load()}catch(e){msg(e.message)}}
el('export').onclick=()=>{const lines=[['Tým','Hráč 1','Hráč 2','Hráč 3','Hráč 4','Hráč 5','Datum registrace'],...teams.map(t=>[t.team_name,...Array.from({length:5},(_,i)=>t.players?.[i]||''),new Date(t.created_at).toLocaleString('cs-CZ')])];const csv='\uFEFF'+lines.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='kuvag-hospodsky-kviz-tymy.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
(async()=>{try{const s=JSON.parse(sessionStorage.getItem('quizSession')||'null');if(s?.refresh_token){const r=await fetch(url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'apikey':key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})});if(r.ok)session(await r.json());else session(null)}}catch{session(null)}})();
</script></body></html>
